name: ${COMPOSE_PROJECT_NAME:-neon-selfhost}

services:
  compute_state_init:
    build:
      context: ./configs/neon/compute_wrapper
      dockerfile: Dockerfile
      args:
        REPOSITORY: ${NEON_REPOSITORY:-ghcr.io/neondatabase}
        COMPUTE_IMAGE: ${NEON_COMPUTE_IMAGE:-compute-node-v16}
        TAG: ${NEON_COMPUTE_TAG:-latest}
    image: ${NEON_COMPUTE_WRAPPER_IMAGE:-neon-selfhost/compute:dev}
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        chown 65532:65532 /var/lib/neon/compute
        chmod 0755 /var/lib/neon/compute
        mkdir -p /var/lib/neon/compute/writer-leases
        chown 65532:65532 /var/lib/neon/compute/writer-leases
        chmod 01777 /var/lib/neon/compute/writer-leases
        mkdir -p /var/lib/neon/compute/applied
        chmod 01777 /var/lib/neon/compute/applied
    volumes:
      - compute_state:/var/lib/neon/compute

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: neon-selfhost/controller:dev
    restart: unless-stopped
    user: "65532:0"
    group_add:
      - "${CONTAINER_ENGINE_GID:-0}"
    security_opt:
      - label=disable
    environment:
      HTTP_HOST: 0.0.0.0
      PORT: "8080"
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD before running podman compose}
      CONTROLLER_DATA_DIR: /var/lib/neon/controller
      COMPUTE_DATA_DIR: /var/lib/neon/compute
      PRIMARY_ENDPOINT_MODE: docker
      PRIMARY_ENDPOINT_SERVICE: compute
      PRIMARY_ENDPOINT_HOST: 127.0.0.1
      PRIMARY_ENDPOINT_PORT: "55433"
      PRIMARY_ENDPOINT_DATABASE: postgres
      PRIMARY_ENDPOINT_USER: cloud_admin
      PRIMARY_ENDPOINT_PASSWORD: ${PRIMARY_ENDPOINT_PASSWORD:?set PRIMARY_ENDPOINT_PASSWORD before running podman compose}
      PRIMARY_ENDPOINT_BACKEND_HOST: ${PRIMARY_ENDPOINT_BACKEND_HOST:-compute}
      PRIMARY_ENDPOINT_BACKEND_PORT: ${PRIMARY_ENDPOINT_BACKEND_PORT:-55433}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_COMPOSE_PROJECT: ${DOCKER_COMPOSE_PROJECT:-neon-selfhost}
      PAGESERVER_API: http://pageserver:9898
      PAGESERVER_PG_VERSION: "16"
      PAGESERVER_VALID_TENANT_GENERATIONS: ${PAGESERVER_VALID_TENANT_GENERATIONS:-}
      BRANCH_ENDPOINT_BIND_HOST: 0.0.0.0
      BRANCH_ENDPOINT_PORT_START: "56000"
      BRANCH_ENDPOINT_PORT_END: "56049"
      BRANCH_ENDPOINT_COMPUTE_IMAGE: ${NEON_COMPUTE_WRAPPER_IMAGE:-neon-selfhost/compute:dev}
    ports:
      - "127.0.0.1:${CONTROLLER_HOST_PORT:-8080}:8080"
      - "127.0.0.1:56000-56049:56000-56049"
    volumes:
      - controller_state:/var/lib/neon/controller
      - compute_state:/var/lib/neon/compute
      - ${CONTAINER_ENGINE_SOCKET:-/run/podman/podman.sock}:/var/run/docker.sock
    networks:
      - neon_internal
    depends_on:
      compute_state_init:
        condition: service_completed_successfully

  smoke_client:
    image: docker.io/curlimages/curl:8.14.1
    profiles: ["writer-handoff"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    networks:
      - neon_internal
    depends_on:
      controller:
        condition: service_started

  storage_broker:
    image: ${NEON_IMAGE:-ghcr.io/neondatabase/neon:latest}
    restart: unless-stopped
    profiles: ["neon"]
    command:
      - storage_broker
      - --listen-addr=0.0.0.0:50051
    networks:
      - neon_internal

  pageserver:
    image: ${NEON_IMAGE:-ghcr.io/neondatabase/neon:latest}
    restart: unless-stopped
    profiles: ["neon"]
    volumes:
      - pageserver_data:/data
      - ./configs/neon/pageserver/identity.toml:/data/.neon/identity.toml:ro
      - ./configs/neon/pageserver/pageserver.toml:/data/.neon/pageserver.toml:ro
    depends_on:
      - storage_broker
    networks:
      - neon_internal

  safekeeper1:
    image: ${NEON_IMAGE:-ghcr.io/neondatabase/neon:latest}
    restart: unless-stopped
    profiles: ["neon"]
    command:
      - safekeeper
      - --listen-pg=safekeeper1:5454
      - --listen-http=0.0.0.0:7676
      - --id=1
      - --broker-endpoint=http://storage_broker:50051
      - -D
      - /data
    volumes:
      - safekeeper1_data:/data
    depends_on:
      - storage_broker
    networks:
      - neon_internal

  compute:
    build:
      context: ./configs/neon/compute_wrapper
      dockerfile: Dockerfile
      args:
        REPOSITORY: ${NEON_REPOSITORY:-ghcr.io/neondatabase}
        COMPUTE_IMAGE: ${NEON_COMPUTE_IMAGE:-compute-node-v16}
        TAG: ${NEON_COMPUTE_TAG:-latest}
    image: ${NEON_COMPUTE_WRAPPER_IMAGE:-neon-selfhost/compute:dev}
    restart: unless-stopped
    profiles: ["neon"]
    environment:
      PG_VERSION: ${PG_VERSION:-16}
      TENANT_ID: ${TENANT_ID:-}
      TIMELINE_ID: ${TIMELINE_ID:-}
      PRIMARY_ENDPOINT_PASSWORD: ${PRIMARY_ENDPOINT_PASSWORD:?set PRIMARY_ENDPOINT_PASSWORD before running podman compose}
      ENDPOINT_APPLIED_FILE: /var/lib/neon/compute/applied/primary.json
    volumes:
      - compute_state:/var/lib/neon/compute
      - compute_cache:/neon/cache
      - ./configs/neon/compute_wrapper/var/db/postgres/configs:/var/db/postgres/configs:ro
      - ./configs/neon/compute_wrapper/shell:/shell:ro
    entrypoint:
      - /shell/compute.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55433 -U cloud_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:55433:55433"
    depends_on:
      compute_state_init:
        condition: service_completed_successfully
      pageserver:
        condition: service_started
      safekeeper1:
        condition: service_started
    networks:
      - neon_internal

volumes:
  controller_state:
  compute_state:
  compute_cache:
  pageserver_data:
  safekeeper1_data:

networks:
  neon_internal:
    driver: bridge
